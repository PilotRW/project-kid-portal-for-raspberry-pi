# Example /etc/keyd/default.conf hardening layer for production kiosks.
# Keep remote navigation keys intact and disable common browser escape shortcuts.

[ids]
*

[main]
left = left
right = right
up = up
down = down
enter = enter
esc = esc
backspace = esc

[control]
t = noop
n = noop
l = noop
w = noop
q = noop
r = noop
shift-r = noop

[alt]
tab = noop
f4 = noop
left = noop
right = noop

[meta]
tab = noop
