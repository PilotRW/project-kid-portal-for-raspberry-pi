<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kid Portal Player</title>
    <link rel="stylesheet" href="/static/styles.css?v=20260820-03">
  </head>
  <body>
    <main class="watch-shell">
      <header class="compact-header watch-header">
        <button class="icon-button" id="back-button" aria-label="Back">‹</button>
        <button class="nav-button" id="home-button" type="button">Home</button>
        <h2>YouTube</h2>
      </header>
      <iframe
        id="youtube-player"
        class="video-frame"
        data-video-id="__VIDEO_ID__"
        src="__IFRAME_SRC__"
        title="YouTube video player"
        allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
        sandbox="allow-scripts allow-same-origin allow-presentation"
        allowfullscreen>
      </iframe>
      <div id="player-guard-status" class="player-guard-status" hidden></div>
    </main>
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
      const allowedVideoId = document.querySelector("#youtube-player").dataset.videoId;
      const limitReachedOnLoad = __LIMIT_REACHED__;
      const blockedMessage = __BLOCKED_MESSAGE_JSON__;
      let player = null;
      let guardTriggered = false;
      let usageSessionId = "";
      let lastPlayerState = "paused";

      async function onYouTubeIframeAPIReady() {
        if (blockedMessage) {
          showBlockedMessage(blockedMessage);
          return;
        }
        if (limitReachedOnLoad) {
          showUsageLimit();
          return;
        }
        const started = await startUsageSession();
        if (!started) return;
        player = new YT.Player("youtube-player", {
          events: {
            onReady: guardCurrentVideo,
            onStateChange: handlePlayerStateChange,
          },
        });
        setInterval(guardCurrentVideo, 1200);
        setInterval(sendUsageHeartbeat, 15000);
      }

      async function startUsageSession() {
        const response = await fetch("/api/usage/playback/start", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ video_id: allowedVideoId }),
        });
        if (response.status === 429) {
          showUsageLimit();
          return false;
        }
        if (!response.ok) return false;
        const data = await response.json();
        usageSessionId = data.session_id;
        return true;
      }

      function handlePlayerStateChange(event) {
        lastPlayerState = event.data === YT.PlayerState.PLAYING ? "playing" : "paused";
        guardCurrentVideo();
        sendUsageHeartbeat();
      }

      async function sendUsageHeartbeat() {
        if (!usageSessionId) return;
        const response = await fetch("/api/usage/playback/heartbeat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: usageSessionId, state: lastPlayerState }),
        });
        if (!response.ok) return;
        const data = await response.json();
        if (data.usage?.limit_reached) {
          showUsageLimit();
        }
      }

      async function stopUsageSession() {
        if (!usageSessionId) return;
        navigator.sendBeacon(
          "/api/usage/playback/stop",
          new Blob([JSON.stringify({ session_id: usageSessionId })], { type: "application/json" }),
        );
      }

      function showUsageLimit() {
        guardTriggered = true;
        lastPlayerState = "paused";
        const status = document.querySelector("#player-guard-status");
        status.hidden = false;
        status.textContent = "Daily viewing limit reached.";
        try {
          player?.stopVideo();
        } catch (error) {
          // Cross-origin player control can fail while the iframe is unloading.
        }
        document.querySelector("#youtube-player").removeAttribute("src");
        window.setTimeout(() => {
          window.location.href = "/#youtube";
        }, 1800);
      }

      function showBlockedMessage(message) {
        guardTriggered = true;
        lastPlayerState = "paused";
        const status = document.querySelector("#player-guard-status");
        status.hidden = false;
        status.textContent = message;
        document.querySelector("#youtube-player").removeAttribute("src");
        window.setTimeout(() => {
          window.location.href = "/#youtube";
        }, 1800);
      }

      function guardCurrentVideo() {
        if (!player || guardTriggered || typeof player.getVideoData !== "function") return;
        const currentVideoId = player.getVideoData()?.video_id;
        if (currentVideoId && currentVideoId !== allowedVideoId) {
          guardTriggered = true;
          const status = document.querySelector("#player-guard-status");
          status.hidden = false;
          status.textContent = "Blocked: this video was not selected through Kid Portal search.";
          try {
            player.stopVideo();
          } catch (error) {
            // The browser may deny cross-origin control during navigation; the redirect below is the fallback.
          }
          window.setTimeout(() => {
            window.location.href = "/#youtube";
          }, 900);
        }
      }

      document.querySelector("#back-button").addEventListener("click", () => history.back());
      document.querySelector("#home-button").addEventListener("click", () => window.location.href = "/");
      window.addEventListener("pagehide", stopUsageSession);
      document.addEventListener("keydown", (event) => {
        if (["Escape", "Backspace"].includes(event.key)) {
          event.preventDefault();
          history.back();
        }
      });
      document.addEventListener("contextmenu", (event) => event.preventDefault());
    </script>
  </body>
</html>
