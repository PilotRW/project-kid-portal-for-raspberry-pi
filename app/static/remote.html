<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kid Portal Remote</title>
    <link rel="stylesheet" href="/static/remote.css?v=20260906-01" />
  </head>
  <body>
    <main class="remote-shell">
      <section class="remote-login" id="remote-login">
        <div>
          <p class="eyebrow">Kid Portal</p>
          <h1>Remote</h1>
          <p class="muted">Use your phone as a Fire TV style remote for the HDMI kiosk.</p>
        </div>
        <form id="login-form" class="login-form">
          <label for="pin">Remote PIN</label>
          <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" required />
          <button type="submit">Unlock remote</button>
        </form>
        <p class="status" id="login-status" role="status"></p>
      </section>

      <section class="remote-panel" id="remote-panel" hidden>
        <header class="remote-header">
          <div>
            <p class="eyebrow">Kid Portal</p>
            <h1>Remote</h1>
          </div>
          <button class="small-button" id="lock-remote" type="button">Lock</button>
        </header>

        <div class="dpad" aria-label="Navigation">
          <button class="dpad-button dpad-up" type="button" data-key="up">Up</button>
          <button class="dpad-button dpad-left" type="button" data-key="left">Left</button>
          <button class="dpad-button dpad-ok" type="button" data-key="ok">OK</button>
          <button class="dpad-button dpad-right" type="button" data-key="right">Right</button>
          <button class="dpad-button dpad-down" type="button" data-key="down">Down</button>
        </div>

        <div class="command-grid">
          <button type="button" data-key="back">Back</button>
          <button type="button" data-key="home">Home</button>
          <button type="button" data-key="play_pause">Play / Pause</button>
          <button type="button" data-key="volume_down">Vol -</button>
          <button type="button" data-key="mute">Mute</button>
          <button type="button" data-key="volume_up">Vol +</button>
        </div>

        <form class="text-form" id="type-form">
          <label for="remote-text">Send text to focused field</label>
          <div class="text-row">
            <input id="remote-text" name="text" type="text" maxlength="160" autocomplete="off" />
            <button type="submit">Send</button>
          </div>
        </form>

        <p class="status" id="remote-status" role="status"></p>
      </section>
    </main>
    <script src="/static/remote.js?v=20260906-01"></script>
  </body>
</html>
