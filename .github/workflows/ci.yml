name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[dev]"
      - name: Test
        run: .venv/bin/python -m pytest
      - name: Shell syntax
        run: |
          bash -n deploy/bootstrap-pi.sh
          bash -n deploy/deploy-to-pi.sh
          bash -n deploy/check-pi.sh
          bash -n deploy/scripts/pi-install.sh
          sh -n deploy/scripts/kid-portal-display-mode.sh
          sh -n deploy/scripts/kid-portal-kiosk-control.sh
          sh -n deploy/scripts/kid-portal-network-access.sh
          sh -n deploy/scripts/kid-portal-software-update.sh
          sh -n deploy/scripts/kid-portal-wifi.sh
          sh -n deploy/scripts/kid-portal-youtube-key.sh
